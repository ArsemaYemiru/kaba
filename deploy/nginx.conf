server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;
    # Sign-in and password changes answer with several large Set-Cookie headers
    # (session token + signed session cache); the 4k default answered them with a
    # 502 "upstream sent too big header", which signed staff out mid-change.
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
