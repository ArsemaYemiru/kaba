name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaba-production-deploy
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/checks.yml

  build-images:
    name: Build and publish Docker images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.metadata.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image_prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.metadata.outputs.image_prefix }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_URL || 'http://13.140.175.12:3006' }}
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
          cache-from: type=gha,scope=kaba-web
          cache-to: type=gha,mode=max,scope=kaba-web,ignore-error=true
      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tooling
          push: true
          tags: ${{ steps.metadata.outputs.image_prefix }}-tooling:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=kaba-tooling
          cache-to: type=gha,mode=max,scope=kaba-tooling,ignore-error=true

  deploy:
    name: Deploy to production server
    needs: build-images
    # workflow_dispatch from a feature branch must never deploy production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'http://13.140.175.12:3006' }}
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      IMAGE_PREFIX: ${{ needs.build-images.outputs.image_prefix }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST" && test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY" && test -n "$PROD_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > "$HOME/.ssh/config"
      - name: Copy deployment files
        run: |
          ssh "$PROD_USER@$PROD_HOST" 'mkdir -p /opt/kaba-prod'
          scp docker-compose.production.yml deploy/deploy.sh deploy/nginx.conf "$PROD_USER@$PROD_HOST:/opt/kaba-prod/"
      - name: Log in to GHCR on server
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$GHCR_USERNAME" && test -n "$GHCR_TOKEN"
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]
          ssh "$PROD_USER@$PROD_HOST" 'install -d -m 700 /opt/kaba-prod/.docker'
          printf '%s' "$GHCR_TOKEN" | ssh "$PROD_USER@$PROD_HOST" \
            "DOCKER_CONFIG=/opt/kaba-prod/.docker docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Pull, migrate, and restart
        run: |
          ssh "$PROD_USER@$PROD_HOST" \
            "export IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG'; bash /opt/kaba-prod/deploy.sh"
      - name: Publish summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo '## Kaba production deployment'
            echo "Status: $STATUS"
            echo "Commit: $IMAGE_TAG"
            echo "Images: $IMAGE_PREFIX-web:$IMAGE_TAG and $IMAGE_PREFIX-tooling:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
