services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feta -d feta"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_USER: feta
      POSTGRES_PASSWORD: feta
      POSTGRES_DB: feta
    ports:
      - "127.0.0.1:${FETA_DB_PORT:-5435}:5432"
    volumes:
      - feta_pgdata:/var/lib/postgresql/data

volumes:
  feta_pgdata:
